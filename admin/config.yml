{
  "backend": {
    "name": "github",
    "repo": "matheussumere/ms.dev-portifolio",
    "branch": "main"
  },
  "locale": "pt",
  "media_folder": "uploads",
  "public_folder": "/uploads",
  "collections": [
    {
      "name": "content",
      "label": "Conteúdo do site",
      "format": "json",
      "files": [
        {
          "name": "site",
          "label": "Empresa e vitrine",
          "file": "content/site.json",
          "fields": [
            {
              "name": "company",
              "label": "Empresa",
              "widget": "object",
              "fields": [
                {
                  "name": "name",
                  "label": "Nome",
                  "widget": "string"
                },
                {
                  "name": "whatsapp",
                  "label": "WhatsApp (país + DDD + número)",
                  "widget": "string",
                  "pattern": [
                    "^[0-9]{10,15}$",
                    "Use apenas números, com país e DDD."
                  ]
                },
                {
                  "name": "phone",
                  "label": "Telefone para exibição",
                  "widget": "string"
                },
                {
                  "name": "email",
                  "label": "E-mail",
                  "widget": "string"
                },
                {
                  "name": "description",
                  "label": "Apresentação",
                  "widget": "text"
                }
              ]
            },
            {
              "name": "analytics",
              "label": "Métricas Plausible",
              "widget": "object",
              "fields": [
                {
                  "name": "enabled",
                  "label": "Ativar envio de eventos",
                  "widget": "boolean",
                  "default": false
                },
                {
                  "name": "domain",
                  "label": "Domínio cadastrado no Plausible",
                  "widget": "string",
                  "required": false
                },
                {
                  "name": "endpoint",
                  "label": "Endpoint",
                  "widget": "string",
                  "default": "https://plausible.io/api/event"
                }
              ]
            },
            {
              "name": "demos",
              "label": "Modelos da vitrine",
              "widget": "list",
              "allow_add": false,
              "fields": [
                {
                  "name": "id",
                  "label": "Id",
                  "widget": "hidden"
                },
                {
                  "name": "name",
                  "label": "Nome",
                  "widget": "string"
                },
                {
                  "name": "category",
                  "label": "Categoria",
                  "widget": "select",
                  "options": [
                    {
                      "label": "Serviços locais",
                      "value": "servicos"
                    },
                    {
                      "label": "Beleza",
                      "value": "beleza"
                    },
                    {
                      "label": "Comércio",
                      "value": "comercio"
                    },
                    {
                      "label": "Profissionais",
                      "value": "criativos"
                    },
                    {
                      "label": "Comunidades",
                      "value": "comunidade"
                    }
                  ]
                },
                {
                  "name": "category_label",
                  "label": "Categoria para exibição",
                  "widget": "string"
                },
                {
                  "name": "description",
                  "label": "Descrição",
                  "widget": "text"
                },
                {
                  "name": "preview",
                  "label": "Imagem de prévia",
                  "widget": "image"
                }
              ],
              "min": 10,
              "max": 10
            }
          ]
        },
        {
          "name": "templates",
          "label": "Contatos dos modelos",
